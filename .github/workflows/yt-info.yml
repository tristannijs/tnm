name: YouTube-info ophalen (eenmalig)
on:
  push:
    branches: [yt-info]
    paths: [.github/workflows/yt-info.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Info en thumbnails
        run: |
          mkdir -p yt
          for id in lYYR9HbSDsE BWKjtCglRUY; do
            curl -fsSL "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$id&format=json" -o yt/$id.oembed.json || echo fail > yt/$id.oembed.json
            curl -fsSL -A "Mozilla/5.0" -H "Accept-Language: en" -b "CONSENT=YES+1" "https://www.youtube.com/watch?v=$id" -o /tmp/w.html || true
            grep -oE '"(uploadDate|datePublished)" ?content="[^"]+"|"uploadDate":"[^"]+"|"lengthSeconds":"[0-9]+"|"width":[0-9]+,"height":[0-9]+' /tmp/w.html | sort -u | head -20 > yt/$id.meta.txt || true
            for q in maxresdefault sddefault hqdefault; do curl -fsSL "https://i.ytimg.com/vi/$id/$q.jpg" -o yt/$id-$q.jpg && break; done
          done
          pip install -q yt-dlp && for id in lYYR9HbSDsE BWKjtCglRUY; do yt-dlp --skip-download --print "%(title)s|%(upload_date)s|%(duration)s|%(width)sx%(height)s" "https://www.youtube.com/watch?v=$id" > yt/$id.ytdlp.txt 2>&1 || true; done
          ls -la yt; cat yt/*.txt yt/*.json
      - name: Bewaren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/yt-info.yml
          git add -A && git commit -m "YouTube-info opgehaald" && git push

name: Flickr-foto's (eenmalig, 3)
on:
  push:
    branches: [flickr-look3]
    paths: [.github/workflows/flickr-look3.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fl/img3
          while read -r u; do curl -sSL "$u" -o "fl/img3/$(basename $u)"; done < fl/all.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/flickr-look3.yml; git add -A; git commit -m "flickr look3"; git push

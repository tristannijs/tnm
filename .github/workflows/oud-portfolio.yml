name: Oude muziek ophalen (eenmalig, poging 2)
on:
  push:
    branches: [oud-portfolio]
    paths: [.github/workflows/oud-portfolio.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestanden ophalen
        run: |
          mkdir -p oud/muziek; : > oud/muziek/log.txt
          while read -r n id q; do
            B="https://cdn-prod-ccv.adobe.com/$id/rend"
            curl -fsSL --retry 3 "$B/${id}_540.mp4?$q" -o "oud/muziek/$n-$id.mp4" \
              && echo "$n $id ok $(stat -c%s oud/muziek/$n-$id.mp4)" >> oud/muziek/log.txt || echo "$n $id FAIL" >> oud/muziek/log.txt
          done < oud/muziek-urls.txt
          cat oud/muziek/log.txt
      - name: Resultaat bewaren en deze workflow verwijderen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/oud-portfolio.yml
          git add -A
          git commit -m "Oude muziek: bestanden opgehaald"
          git push

name: Web3Forms-test (eenmalig)
on:
  push:
    branches: [w3f-test]
    paths: [.github/workflows/w3f.yml]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p w; curl -sS -m 60 -w '\nHTTP %{http_code} in %{time_total}s\n' -X POST https://api.web3forms.com/submit -H 'Content-Type: application/json' -H 'Accept: application/json' -H 'Origin: https://tristannijs.media' \
            -d '{"access_key":"60a154af-3604-416d-95fd-a40dd07668a2","subject":"Website: test","from_name":"tristannijs.media","name":"Test","email":"tristannijs.media@gmail.com","soort":"Test","message":"Testbericht: het contactformulier werkt."}' > w/out.txt 2>&1 || true
          cat w/out.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/w3f.yml; git add -A; git commit -m "w3f result"; git push

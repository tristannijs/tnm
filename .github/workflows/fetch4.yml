name: Eclips + video (eenmalig)
on:
  push:
    branches: [fetch4]
    paths: [.github/workflows/fetch4.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p f4
          curl -sSL https://live.staticflickr.com/65535/55628757102_c2028cf5c2_b.jpg -o f4/eclips_b.jpg
          id=IiNL64Zoiko
          curl -sSL "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$id&format=json" -o f4/yt.json
          for q in maxresdefault sddefault hqdefault; do curl -fsSL "https://i.ytimg.com/vi/$id/$q.jpg" -o f4/yt.jpg && break; done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/fetch4.yml; git add -A; git commit -m "fetch4"; git push

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tristan Nijs Media</title>
<meta name="description" content="Tristan Nijs is monteur en videograaf uit Gent: aftermovies, trouwfilms en promo's, en student montage aan het RITCS.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bar" id="bar">
  <a class="logo-link" href="#top" aria-label="Tristan Nijs Media, naar boven"><img src="assets/logo.png" alt="Tristan Nijs Media" width="1320" height="245"></a>
  <nav class="nav" aria-label="Hoofdmenu">
    <a href="#videografie">Videografie</a>
    <a href="#ritcs">RITCS</a>
    <a href="#overig">Overig</a>
    <a href="#" class="lang" aria-label="Taal: Nederlands">NL</a>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Menu openen">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </nav>
</header>

<nav class="drawer" id="drawer" hidden aria-label="Menu">
  <a href="#videografie">Videografie</a>
  <a href="#ritcs">RITCS</a>
  <a href="#overig">Overig</a>
</nav>

<main id="top">

  <!-- HERO: each layer is one background. Drop a video in later with data-video="path.mp4";
       until then the image is the placeholder. -->
  <section class="hero" id="hero">
    <div class="hero-bg" aria-hidden="true">
      <div class="layer on" data-key="home"        data-img="assets/hero/home.jpg"        data-video=""></div>
      <div class="layer"    data-key="ritcs"       data-img="assets/hero/ritcs.jpg"       data-video=""></div>
      <div class="layer"    data-key="videografie" data-img="assets/hero/videografie.jpg" data-video=""></div>
      <div class="layer"    data-key="overig"      data-img="assets/hero/overig.jpg"      data-video=""></div>
    </div>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="hero-doors" id="doors">
      <a class="door" href="#ritcs" data-bg="ritcs">RITCS</a>
      <a class="door" href="#videografie" data-bg="videografie">Videografie</a>
      <a class="door" href="#overig" data-bg="overig">Overig</a>
    </div>
    <a class="hero-down" href="#uitgelicht" aria-label="Naar beneden">
      <svg viewBox="0 0 40 20" aria-hidden="true"><path d="M1 1l19 17L39 1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </a>
  </section>

  <section class="sec" id="uitgelicht">
    <h2 class="sh">Uitgelicht</h2>
    <div class="cf" id="cf" tabindex="0" aria-roledescription="carrousel" aria-label="Uitgelichte projecten">
      <div class="cf-track" id="cfTrack"></div>
      <button class="arrow prev" type="button" data-dir="-1" aria-label="Vorige"><svg viewBox="0 0 20 40" aria-hidden="true"><path d="M19 1L1 20l18 19" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="arrow next" type="button" data-dir="1" aria-label="Volgende"><svg viewBox="0 0 20 40" aria-hidden="true"><path d="M1 1l18 19L1 39" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </section>

  <section class="sec" id="recent">
    <h2 class="sh">Recent</h2>
    <div class="rc" id="rc">
      <div class="rc-list" id="rcList"></div>
      <button class="arrow prev" type="button" data-dir="-1" aria-label="Vorige" hidden><svg viewBox="0 0 20 40" aria-hidden="true"><path d="M19 1L1 20l18 19" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="arrow next" type="button" data-dir="1" aria-label="Volgende"><svg viewBox="0 0 20 40" aria-hidden="true"><path d="M1 1l18 19L1 39" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </section>

  <section class="tl-sec" id="tijdlijn">
    <div class="tl-head">
      <h2 class="sh">Tijdlijn</h2>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" class="zb" data-z="out" aria-label="Uitzoomen">−</button><span class="zl">100%</span><button type="button" class="zb" data-z="in" aria-label="Inzoomen">+</button><button type="button" class="zb fit" data-z="fit">Passend</button>
      </div>
    </div>
    <div id="tl"></div>
  </section>

</main>

<dialog id="player" aria-labelledby="plTitle">
  <div class="pl-screen" id="plScreen"></div>
  <div class="pl-body">
    <div><h3 id="plTitle"></h3><p id="plMeta"></p></div>
    <div class="pl-actions">
      <div class="pl-parts" id="plParts"></div>
      <a class="btn" id="plLink" href="#" target="_blank" rel="noopener">YouTube ↗</a>
      <button class="btn" id="plClose" type="button">Sluiten</button>
    </div>
  </div>
</dialog>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
